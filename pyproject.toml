[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jianying-draft-sdk"
version = "0.1.0"
description = "Python SDK for Jianying draft editing, encryption, decryption, and export workflows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pycryptodome>=3.20",
]
authors = [
  { name = "OpenAI Codex" }
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
